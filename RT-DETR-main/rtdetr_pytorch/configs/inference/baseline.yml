__include__:
- ../rtdetr/fewd_rtdetr_r18_ouludefect.yml
RTDETR:
  backbone: PResNet
  encoder: HybridEncoder
PResNet:
  depth: 18
  variant: d
  return_idx:
  - 1
  - 2
  - 3
  freeze_at: -1
  freeze_norm: false
  pretrained: false
HybridEncoder:
  in_channels:
  - 128
  - 256
  - 512
  hidden_dim: 256
  expansion: 0.5
  eval_spatial_size:
  - 640
  - 640
RTDETRTransformer:
  num_decoder_layers: 3
